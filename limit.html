<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FULIZAA | Limit Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #50C878;

            color: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =================================
           MAIN PAGE
        ================================= */

        .page {
            width: 100%;

            min-height: 100vh;

            padding:
                20px
                16px
                40px;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,0.08),
                    transparent 55%
                ),
                #50C878;
        }


        /* =================================
           BRAND
        ================================= */

        .brand {
            width: 100%;

            text-align: center;

            margin-top: 8px;

            margin-bottom: 25px;
        }

        .brand h1 {
            color: #FFFFFF;

            font-size: 32px;

            line-height: 1.15;

            font-weight: 900;

            letter-spacing: 1px;

            text-shadow:
                0 4px 12px
                rgba(0,0,0,0.6);

            margin-bottom: 7px;
        }

        .brand p {
            color: #000000;

            font-size: 14px;

            font-weight: 800;
        }


        /* =================================
           MAIN CARD
        ================================= */

        .limit-card {
            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            padding:
                24px
                18px
                25px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 8px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           HEADING
        ================================= */

        .limit-card h2 {
            color: #000000;

            font-size: 26px;

            font-weight: 900;

            text-align: center;

            margin-bottom: 8px;
        }

        .intro {
            color: #000000;

            font-size: 14px;

            line-height: 1.5;

            font-weight: 700;

            text-align: center;

            margin-bottom: 22px;
        }


        /* =================================
           CLIENT INFORMATION
        ================================= */

        .info-box {
            width: 100%;

            padding: 17px;

            margin-bottom: 18px;

            background: #FFFFFF;

            border:
                2px solid #000000;

            border-radius: 14px;
        }

        .info-label {
            display: block;

            color: #555555;

            font-size: 12px;

            font-weight: 900;

            margin-bottom: 6px;

            text-transform: uppercase;
        }

        .info-value {
            color: #000000;

            font-size: 20px;

            font-weight: 900;
        }


        /* =================================
           CURRENT LIMIT INPUT
        ================================= */

        .current-limit {
            width: 100%;

            padding: 18px;

            margin-bottom: 22px;

            background: #FFFFFF;

            border:
                2px solid #000000;

            border-radius: 15px;

            text-align: center;
        }

        .current-limit-title {
            color: #000000;

            font-size: 12px;

            font-weight: 900;

            margin-bottom: 9px;
        }

        .current-limit-input {
            width: 100%;

            min-height: 52px;

            padding: 13px 14px;

            border:
                2px solid #000000;

            border-radius: 12px;

            background: #FFFFFF;

            color: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 20px;

            font-weight: 900;

            text-align: center;

            outline: none;
        }

        .current-limit-input:focus {
            box-shadow:
                0 0 0 3px
                rgba(80,200,120,0.35);
        }

        .current-limit-input::placeholder {
            color: #777777;

            font-size: 15px;
        }


        /* =================================
           PURPOSE
        ================================= */

        .section-title {
            color: #000000;

            font-size: 18px;

            font-weight: 900;

            margin-bottom: 12px;
        }

        .purpose-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 24px;
        }

        .purpose-option {
            position: relative;
        }

        .purpose-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }

        .purpose-option label {
            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 54px;

            padding: 10px;

            background: #FFFFFF;

            border:
                2px solid #000000;

            border-radius: 12px;

            color: #000000;

            font-size: 14px;

            font-weight: 900;

            text-align: center;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .purpose-option input:checked + label {
            background: #50C878;

            color: #000000;

            transform:
                translateY(-1px);

            box-shadow:
                0 4px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           REQUESTED LIMIT
        ================================= */

        .slots-title {
            color: #000000;

            font-size: 18px;

            font-weight: 900;

            margin-bottom: 12px;
        }

        .slots {
            width: 100%;

            max-height: 230px;

            overflow-y: auto;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            padding: 3px;

            margin-bottom: 23px;
        }

        .slots::-webkit-scrollbar {
            width: 7px;
        }

        .slots::-webkit-scrollbar-track {
            background: #eeeeee;

            border-radius: 10px;
        }

        .slots::-webkit-scrollbar-thumb {
            background: #000000;

            border-radius: 10px;
        }

        .slot {
            width: 100%;

            padding:
                16px
                10px;

            background: #FFFFFF;

            border:
                2px solid #000000;

            border-radius: 12px;

            text-align: center;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .slot input {
            display: none;
        }

        .slot-amount {
            display: block;

            color: #000000;

            font-size: 17px;

            font-weight: 900;

            margin-bottom: 5px;
        }

        .slot-status {
            color: #000000;

            font-size: 11px;

            font-weight: 800;
        }

        .slot:has(input:checked) {
            background: #50C878;

            transform:
                translateY(-1px);

            box-shadow:
                0 4px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           CONTINUE BUTTON
        ================================= */

        .continue-btn {
            width: 100%;

            min-height: 55px;

            padding:
                15px
                18px;

            border: none;

            border-radius: 14px;

            background: #000000;

            color: #FFFFFF;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 6px 0
                rgba(0,0,0,0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .continue-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 8px 0
                rgba(0,0,0,0.35);
        }

        .continue-btn:active {
            transform:
                translateY(3px);

            box-shadow:
                0 2px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           SECURITY
        ================================= */

        .security-line {
            margin-top: 15px;

            color: #000000;

            font-size: 11px;

            font-weight: 800;

            text-align: center;
        }


        /* =================================
           FOOTER
        ================================= */

        footer {
            width: 100%;

            margin-top: 30px;

            text-align: center;
        }

        footer strong {
            display: block;

            color: #FFFFFF;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1px;

            text-shadow:

                rgba(0,0,0,0.5);

            margin
