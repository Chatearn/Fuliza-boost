<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FULIZAA | Limit Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #00A651;

            color: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =================================
           MAIN PAGE
        ================================= */

        .page {
            width: 100%;

            min-height: 100vh;

            padding:
                20px
                16px
                40px;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,0.08),
                    transparent 55%
                ),
                #00A651;
        }


        /* =================================
           BRAND
        ================================= */

        .brand {
            width: 100%;

            text-align: center;

            margin-top: 8px;

            margin-bottom: 25px;
        }

        .brand-logo {
            display: block;

            width: 100%;

            max-width: 650px;

            height: auto;

            margin:
                0 auto;

            object-fit: contain;
        }


        /* =================================
           MAIN CARD
        ================================= */

        .limit-card {
            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            padding:
                24px
                18px
                25px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 8px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           HEADING
        ================================= */

        .limit-card h2 {
            color: #000000;

            font-size: 26px;

            font-weight: 900;

            text-align: center;

            margin-bottom: 8px;
        }

        .intro {
            color: #000000;

            font-size: 14px;

            line-height: 1.5;

            font-weight: 700;

            text-align: center;

            margin-bottom: 22px;
        }


        /* =================================
           CLIENT INFORMATION
        ================================= */

        .info-box {
            width: 100%;

            padding: 17px;

            margin-bottom: 18px;

            background: #FFFFFF;

            border:
                2px solid #000000;

            border-radius: 14px;
        }

        .info-label {
            display: block;

            color: #555555;

            font-size: 12px;

            font-weight: 900;

            margin-bottom: 6px;

            text-transform: uppercase;
        }

        .info-value {
            color: #000000;

            font-size: 20px;

            font-weight: 900;
        }


        /* =================================
           CURRENT LIMIT INPUT
        ================================= */

        .current-limit {
            width: 100%;

            padding: 18px;

            margin-bottom: 22px;

            background: #00A651;

            border:
                2px solid #000000;

            border-radius: 15px;

            text-align: center;
        }

        .current-limit-title {
            color: #FFFFFF;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 0.8px;

            margin-bottom: 11px;

            text-transform: uppercase;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.25);
        }

        .current-limit-input {
            width: 100%;

            min-height: 52px;

            padding: 13px 14px;

            border:
                2px solid #000000;

            border-radius: 12px;

            background: #FFFFFF;

            color: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 20px;

            font-weight: 900;

            text-align: center;

            outline: none;
        }

        .current-limit-input:focus {
            box-shadow:
                0 0 0 3px
                rgba(0,166,81,0.35);
        }

        .current-limit-input::placeholder {
            color: #777777;

            font-size: 15px;
        }


        /* =================================
           CONTINUE BUTTON
        ================================= */

        .continue-btn {
            width: 100%;

            min-height: 55px;

            padding:
                15px
                18px;

            border: none;

            border-radius: 14px;

            background: #000000;

            color: #FFFFFF;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 6px 0
                rgba(0,0,0,0.35);

                box-shadow
