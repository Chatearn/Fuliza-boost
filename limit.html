<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FULIZA | Current Limit</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .hero-badge {
            font-size: 20px;
            font-weight: 700;
        }

        .limit-card input {
            width: 100%;
            min-height: 55px;
            font-size: 18px;
            padding: 14px;
        }

        .primary-btn {
            margin-top: 18px;
        }

    </style>

</head>

<body>

<div class="page">

    <!-- =================================
         FULIZA BRAND
    ================================== -->

    <header class="brand">

        <h1>FULIZA</h1>

        <p>
            Limit Management Portal
        </p>

    </header>


    <!-- =================================
         CURRENT LIMIT
    ================================== -->

    <section class="hero">

        <div class="hero-badge">
            CURRENT FULIZA LIMIT
        </div>

        <h2>
            Enter Your Current Limit
        </h2>

        <p>
            Enter your current FULIZA limit below to continue.
        </p>

        <div class="limit-card">

            <label for="currentLimit">
                CURRENT FULIZA LIMIT
            </label>

            <input
                type="number"
                id="currentLimit"
                placeholder="Enter current limit"
                min="0"
                inputmode="numeric">

        </div>

        <button
            class="primary-btn"
            onclick="continueProcess()">

            CONTINUE →

        </button>

        <div class="security-line">
            🔒 Secure &nbsp; • &nbsp; Fast &nbsp; • &nbsp; 24/7
        </div>

    </section>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        <strong>FULIZA</strong>

        <p>
            Independent limit-management service
        </p>

        <small>
            © 2026 FULIZA • All Rights Reserved
        </small>

    </footer>

</div>


<script>

function continueProcess() {

    const currentLimit =
        document.getElementById("currentLimit").value;

    if (!currentLimit) {

        alert("Please enter your current FULIZA limit.");

        return;

    }

    localStorage.setItem(
        "currentFulizaLimit",
        currentLimit
    );

    window.location.href =
        "desired-limit.html";

}

</script>

</body>
</html>
