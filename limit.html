<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FULIZAA | Limit Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #50C878;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 20px 16px 40px;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,0.08),
                    transparent 55%
                ),
                #50C878;
        }

        .brand {
            width: 100%;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 25px;
        }

        .brand h1 {
            color: #FFFFFF;
            font-size: 32px;
            line-height: 1.15;
            font-weight: 900;
            letter-spacing: 1px;

            text-shadow:
                0 4px 12px rgba(0,0,0,0.6);

            margin-bottom: 7px;
        }

        .brand p {
            color: #000000;
            font-size: 14px;
            font-weight: 800;
        }

        .limit-card {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;

            padding: 24px 18px 25px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 8px 0 rgba(0,0,0,0.35);
        }

        .limit-card h2 {
            color: #000000;
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
        }

        .intro {
            color: #000000;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 700;
            text-align: center;
            margin-bottom: 22px;
        }

        .info-box {
            width: 100%;
            padding: 17px;
            margin-bottom: 18px;

            background: #FFFFFF;

            border: 2px solid #000000;
            border-radius: 14px;
        }

        .info-label {
            display: block;
            color: #555555;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .info-value {
            color: #000000;
            font-size: 20px;
            font-weight: 900;
        }

        .current-limit {
            width: 100%;
            padding: 18px;
            margin-bottom: 22px;

            background: #FFFFFF;

            border: 2px solid #000000;
            border-radius: 15px;

            text-align: center;
        }

        .current-limit-title {
            color: #000000;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 9px;
        }

        .current-limit-input {
            width: 100%;
            min-height: 52px;

            padding: 13px 14px;

            border: 2px solid #000000;
            border-radius: 12px;

            background: #FFFFFF;
            color: #000000;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 20px;
            font-weight: 900;

            text-align: center;

            outline: none;
        }

        .current-limit-input:focus {
            box-shadow:
                0 0 0 3px rgba(80,200,120,0.35);
        }

        .current-limit-input::placeholder {
            color: #777777;
            font-size: 15px;
        }


        /* =================================
           DROPDOWN SECTIONS
        ================================= */

        .dropdown-section {
            width: 100%;
            margin-bottom: 22px;
        }

        .dropdown-title {
            color: #000000;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .dropdown {
            position: relative;
            width: 100%;
        }

            width: 100%;
            min-height: 54px;
