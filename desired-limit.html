<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FULIZAA | Desired Limit</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #00A651;

            color: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =================================
           MAIN PAGE
        ================================= */

        .page {
            width: 100%;

            min-height: 100vh;

            padding:
                20px
                16px
                40px;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,0.08),
                    transparent 55%
                ),
                #00A651;
        }


        /* =================================
           BRAND
        ================================= */

        .brand {
            width: 100%;

            text-align: center;

            margin-top: 8px;

            margin-bottom: 25px;

            position: relative;
        }

        .brand-logo {
            display: block;

            width: 100%;

            max-width: 650px;

            height: auto;

            margin: 0 auto;

            object-fit: contain;
        }


        /* =================================
           DEMO NOTIFICATIONS
        ================================= */

        .demo-notifications {
            position: absolute;

            right: 4px;

            top: 50%;

            width: 190px;

            height: 55px;

            overflow: hidden;

            pointer-events: none;

            z-index: 5;
        }

        .demo-message {
            position: absolute;

            right: 0;

            bottom: -60px;

            width: 185px;

            padding:
                9px
                10px;

            background: #FFFFFF;

            color: #000000;

            border:
                2px solid #000000;

            border-radius: 10px;

            font-size: 11px;

            font-weight: 900;

            line-height: 1.25;

            text-align: center;

            box-shadow:
                0 4px 0
                rgba(0,0,0,0.25);

            animation:
                messageUp 3.2s linear forwards;
        }

        .demo-label {
            display: block;

            font-size: 9px;

            font-weight: 900;

            color: #00A651;

            margin-bottom: 2px;
        }

        @keyframes messageUp {

            0% {
                transform:
                    translateY(0);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            75% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-115px);

                opacity: 0;
            }

        }


        /* =================================
           MAIN CARD
        ================================= */

        .limit-card {
            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            padding:
                24px
                18px
                25px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 8px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           HEADING
        ================================= */

        .limit-card h2 {
            color: #000000;

            font-size: 26px;

            font-weight: 900;

            text-align: center;

            margin-bottom: 8px;
        }

        .intro {
            color: #000000;

            font-size: 14px;

            line-height: 1.5;

            font-weight: 700;

            text-align: center;

            margin-bottom: 22px;
        }


        /* =================================
           LIMIT SELECTION COLUMNS
        ================================= */

        .limit-options {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 22px;
        }

        .limit-option {
            width: 100%;

            min-height: 82px;

            padding:
                16px
                10px;

            background: #FFFFFF;

            color: #000000;

            border:
                2px solid #000000;

            border-radius: 14px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 18px;

            font-weight: 900;

            text-align: center;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }

        .limit-option:hover {
            transform:
                translateY(-2px);
        }

        .limit-option.selected {
            background: #00A651;

            color: #FFFFFF;

            border:
                3px solid #000000;

            box-shadow:
                0 5px 0
                rgba(0,0,0,0.3);
        }


        /* =================================
           CONTINUE BUTTON
        ================================= */

        .continue-btn {
            width: 100%;

            min-height: 55px;

            padding:
                15px
                18px;

            border: none;

            border-radius: 14px;

            background: #000000;

            color: #FFFFFF;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 6px 0
                rgba(0,0,0,0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .continue-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 8px 0
                rgba(0,0,0,0.35);
        }

        .continue-btn:active {
            transform:
                translateY(3px);

            box-shadow:
                0 2px 0
                rgba(0,0,0,0.35);
        }


        /* =================================
           SECURITY
        ================================= */

        .security-line {
            margin-top: 15px;

            color: #000000;

            font-size: 11px;

            font-weight: 800;

            text-align: center;
        }


        /* =================================
           FOOTER
        ================================= */

        footer {
            width: 100%;

            margin-top: 30px;

            text-align: center;
        }

        footer strong {
            display: block;

            color: #FFFFFF;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1px;

            text-shadow:
                0 3px 8px
                rgba(0,0,0,0.5);

            margin-bottom: 7px;
        }

        footer p {
            color: #000000;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 6px;
        }

        footer small {
            color: #000000;

            font-size: 10px;

            font-weight: 700;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .page {
                padding:
                    16px
                    12px
                    35px;
            }

            .limit-card {
                padding:
                    22px
                    15px
                    23px;
            }

            .limit-card h2 {
                font-size: 24px;
            }

            .limit-options {
                gap: 10px;
            }

            .limit-option {
                min-height: 76px;

                font-size: 16px;
            }

            .demo-notifications {
                right: 2px;

                width: 155px;
            }

            .demo-message {
                width: 150px;

                font-size: 9px;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- =================================
         BRAND
    ================================== -->

    <header class="brand">

        <img
            src="fuliza-logo.jpg"
            alt="FULIZA Logo"
            class="brand-logo"
        >


        <!-- =================================
             DEMO LIVE-STYLE MESSAGES
        ================================== -->

        <div
            id="demoNotifications"
            class="demo-notifications"
        ></div>

    </header>


    <!-- =================================
         DESIRED LIMIT
    ================================== -->

    <main class="limit-card">

        <h2>
            Limit You Want
        </h2>

        <p class="intro">
            Select the limit you want to continue.
        </p>


        <!-- =================================
             LIMIT OPTIONS
        ================================== -->

        <div class="limit-options">

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '10000')"
            >
                KSh 10,000 — KSh 1/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '20000')"
            >
                KSh 20,000 — KSh 400/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '30000')"
            >
                KSh 30,000 — KSh 500/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '40000')"
            >
                KSh 40,000 — KSh 600/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '50000')"
            >
                KSh 50,000 — KSh 700/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '60000')"
            >
                KSh 60,000 — KSh 800/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '70000')"
            >
                KSh 70,000 — KSh 900/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '80000')"
            >
                KSh 80,000 — KSh 950/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '90000')"
            >
                KSh 90,000 — KSh 1,000/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '100000')"
            >
                KSh 100,000 — KSh 1,050/=
            </button>

        </div>


        <!-- =================================
             CONTINUE
        ================================== -->

        <button
            type="button"
            class="continue-btn"
            onclick="continueToNext()"
        >
            CONTINUE →
        </button>


        <div class="security-line">
            🔒 Secure &nbsp; • &nbsp; Fast &nbsp; • &nbsp; Simple
        </div>

    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        <strong>
            FULIZAA
        </strong>

        <p>
            Independent limit-management service
        </p>

        <small>
            © 2026 FULIZAA • All Rights Reserved
        </small>

    </footer>

</div>


<script>

/* =========================================
   SELECT LIMIT
========================================= */

let selectedLimit = "";


function selectLimit(button, value) {

    const options =
        document.querySelectorAll(
            ".limit-option"
        );


    options.forEach(
        function(option) {

            option.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );


    selectedLimit = value;

}


/* =========================================
   CONTINUE
========================================= */

function continueToNext() {

    if (!selectedLimit) {

        alert(
            "Please select the limit you want."
        );

        return;
    }


    localStorage.setItem(
        "fulizaaSelectedSlot",
        selectedLimit
    );


    /*
       Next page will be connected here
       when it is created.
    */

}


/* =========================================
   CURRENT NOTIFICATIONS
========================================= */

const currentNumbers = [

    "0742***287",
    "0718***463",
    "0791***524",
    "0726***815",
    "0703***196",
    "0754***638",
    "0782***351",
    "0114***729"

];


const currentMessages = [

    "Limit options viewed",
    "Limit selection updated",
    "Application information updated",
    "Service status checked",
    "Limit request reviewed",
    "Account information checked"

];


let demoIndex = 0;


function showDemoMessage() {

    const container =
        document.getElementById(
            "demoNotifications"
        );


    const number =
        demoNumbers[
            Math.floor(
                Math.random() *
                demoNumbers.length
            )
        ];


    const message =
        demoMessages[
            Math.floor(
                Math.random() *
                demoMessages.length
            )
        ];


    const notification =
        document.createElement(
            "div"
        );


    notification.className =
        "demo-message";


    notification.innerHTML =

        '<span class="demo-label">' +
        'CURRENT NOTIFICATION' +
        '</span>' +

        number +
        " — " +
        message;


    container.innerHTML = "";


    container.appendChild(
        notification
    );


    demoIndex++;

}


/* Start first message */

showDemoMessage();


/* Change message every 3.5 seconds */

setInterval(
    showDemoMessage,
    3500
);

</script>

</body>

</html>
