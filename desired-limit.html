
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FULIZA BOOST | Desired Limit</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #00A651;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* MAIN PAGE */

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 20px 16px 40px;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,0.08),
                    transparent 55%
                ),
                #00A651;
        }

        /* BRAND */

        .brand {
            width: 100%;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 25px;
            position: relative;
        }

        .brand strong {
            display: inline-block;
            color: #FFFFFF;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 3px 8px rgba(0,0,0,0.4);
        }

        /* MAIN CARD */

        .limit-card {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 24px 18px 25px;
            background: #FFFFFF;
            border-radius: 20px;

            box-shadow:
                0 8px 0 rgba(0,0,0,0.35);
        }

        /* HEADING */

        .limit-card h2 {
            color: #000000;
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
        }

        .intro {
            color: #000000;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 700;
            text-align: center;
            margin-bottom: 22px;
        }

        /* LIMIT SELECTION COLUMNS */

        .limit-options {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .limit-option {
            width: 100%;
            min-height: 82px;
            padding: 16px 10px;
            background: #FFFFFF;
            color: #000000;
            border: 2px solid #E60000;
            border-radius: 14px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }

        .limit-option:hover {
            transform: translateY(-2px);
        }

        .limit-option.selected {
            background: #00A651;
            color: #FFFFFF;
            border: 3px solid #E60000;

            box-shadow:
                0 5px 0 rgba(0,0,0,0.3);
        }

        /* CONTINUE BUTTON */

        .continue-btn {
            width: 100%;
            min-height: 55px;
            padding: 15px 18px;
            border: none;
            border-radius: 14px;
            background: #000000;
            color: #FFFFFF;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;

            box-shadow:
                0 6px 0 rgba(0,0,0,0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .continue-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 0 rgba(0,0,0,0.35);
        }

        .continue-btn:active {
            transform: translateY(3px);

            box-shadow:
                0 2px 0 rgba(0,0,0,0.35);
        }

        /* SECURITY */

        .security-line {
            margin-top: 15px;
            color: #000000;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
        }

        /* FOOTER */

        footer {
            width: 100%;
            max-width: 650px;
            margin: 35px auto 0;
            padding: 24px 15px;
            text-align: center;

            background: rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 18px;
        }

        footer p {
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        footer small {
            display: block;
            color: rgba(255,255,255,0.85);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 16px 12px 35px;
            }

            .limit-card {
                padding: 22px 15px 23px;
            }

            .limit-card h2 {
                font-size: 24px;
            }

            .limit-options {
                gap: 10px;
            }

            .limit-option {
                min-height: 76px;
                font-size: 16px;
            }

            footer {
                padding: 22px 12px;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- BRAND AT TOP -->

    <header class="brand">

        <strong>
            FULIZA BOOST
        </strong>

    </header>


    <!-- DESIRED LIMIT -->

    <main class="limit-card">

        <h2>
            Limit You Want
        </h2>

        <p class="intro">
            Select the limit you want to continue.
        </p>


        <!-- LIMIT OPTIONS -->

        <div class="limit-options">

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '5000')"
            >
                KSh 5,000 — KSh 240/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '10000')"
            >
                KSh 10,000 — KSh 340/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '20000')"
            >
                KSh 20,000 — KSh 440/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '30000')"
            >
                KSh 30,000 — KSh 540/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '40000')"
            >
                KSh 40,000 — KSh 640/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '50000')"
            >
                KSh 50,000 — KSh 740/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '60000')"
            >
                KSh 60,000 — KSh 840/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '70000')"
            >
                KSh 70,000 — KSh 940/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '80000')"
            >
                KSh 80,000 — KSh 940/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '90000')"
            >
                KSh 90,000 — KSh 1,040/=
            </button>

            <button
                type="button"
                class="limit-option"
                onclick="selectLimit(this, '100000')"
            >
                KSh 100,000 — KSh 1,240/=
            </button>

        </div>


        <!-- CONTINUE -->

        <button
            type="button"
            class="continue-btn"
            onclick="continueToNext()"
        >
            CONTINUE →
        </button>


        <div class="security-line">
            🔒 Secure &nbsp; • &nbsp; Fast &nbsp; • &nbsp; Simple
        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            Independent limit-management service
        </p>

        <small>
            © 2026 FULIZA • All Rights Reserved
        </small>

    </footer>

</div>


<script>

let selectedLimit = "";


function selectLimit(button, value) {

    const options =
        document.querySelectorAll(
            ".limit-option"
        );

    options.forEach(
        function(option) {

            option.classList.remove(
                "selected"
            );

        }
    );

    button.classList.add(
        "selected"
    );

    selectedLimit = value;

}


function continueToNext() {

    if (!selectedLimit) {

        alert(
            "Please select the limit you want."
        );

        return;
    }


    /* Save selected limit */

    localStorage.setItem(
        "fulizaaSelectedSlot",
        selectedLimit
    );


    /* Redirect to payment page */

    window.location.href =
        "payment.html";

}

</script>

</body>

</html>
